name: Sony Stock Checker

on:
  schedule:
    - cron: '0 23 * * *'   # 💡 매일 KST 오전 8시 (UTC 23시) 가방 가격 정기 브리핑
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install selenium requests matplotlib scikit-learn numpy

    - name: Check Stock
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      run: python check_stock.py

    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add price_history.json
        git commit -m "Update price history [skip ci]" || echo "No changes to commit"
        git push
