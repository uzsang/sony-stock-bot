name: Sony Stock Checker

on:
  schedule:
    - cron: '0 0,12 * * *'
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # 💡 깃허브 서버가 저장소에 파일(가격 기록)을 다시 쓸 수 있도록 권한을 부여합니다.
    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        pip install selenium requests

    - name: Check Stock
      env:
        TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        TELEGRAM_TOKEN_REGULAR: ${{ secrets.TELEGRAM_TOKEN_REGULAR }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        CRON_TRIGGER: ${{ github.event.schedule }}
      run: python check_stock.py

    # 💡 변동된 가격 기록 파일(price_history.json)이 있다면 자동으로 GitHub에 저장합니다.
    # [skip ci]를 붙여서 푸시로 인해 매크로가 중복 실행되는 것을 방지합니다.
    - name: Commit and Push changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add price_history.json
        git commit -m "Update price history [skip ci]" || echo "No changes to commit"
        git push
